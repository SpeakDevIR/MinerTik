<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earnify Miner Dashboard</title>
    <style>
        :root {
            --bg-deep: #0a0a14;
            --bg-card: rgba(16, 16, 35, 0.65);
            --bg-card-hover: rgba(22, 22, 48, 0.78);
            --border-glass: rgba(255, 255, 255, 0.08);
            --border-glow: rgba(140, 100, 255, 0.35);
            --text-primary: #e0dff5;
            --text-secondary: #b0aec8;
            --text-muted: #7a7899;
            --accent-cyan: #00e5ff;
            --accent-purple: #b44dff;
            --accent-pink: #ff3d7f;
            --accent-green: #00e676;
            --accent-yellow: #ffc107;
            --accent-orange: #ff9100;
            --accent-red: #ff1744;
            --glow-cyan: 0 0 18px rgba(0, 229, 255, 0.4);
            --glow-purple: 0 0 18px rgba(180, 77, 255, 0.4);
            --glow-pink: 0 0 18px rgba(255, 61, 127, 0.35);
            --radius-sm: 10px;
            --radius-md: 16px;
            --radius-lg: 22px;
            --radius-xl: 28px;
            --font-mono: 'SF Mono', 'Cascadia Code', 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
            --font-sans: 'Inter', 'SF Pro Display', 'Segoe UI', system-ui, sans-serif;
            --transition-fast: 0.18s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-smooth: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --blur-amount: 18px;
            --blur-saturate: 1.4;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html {
            scroll-behavior: smooth;
            font-size: 15px;
        }
        body {
            font-family: var(--font-sans);
            background: var(--bg-deep);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            transition: background var(--transition-smooth);
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(140, 100, 255, 0.3);
            border-radius: 10px;
            transition: background var(--transition-fast);
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(140, 100, 255, 0.55);
        }
        ::-webkit-scrollbar-corner {
            background: transparent;
        }

        .bg-gradient-layer {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background: radial-gradient(ellipse at 25% 20%, rgba(100, 40, 220, 0.28) 0%, transparent 55%),
                radial-gradient(ellipse at 70% 60%, rgba(20, 140, 220, 0.22) 0%, transparent 55%),
                radial-gradient(ellipse at 50% 80%, rgba(160, 30, 120, 0.18) 0%, transparent 50%),
                radial-gradient(ellipse at 15% 75%, rgba(0, 180, 200, 0.15) 0%, transparent 45%);
            animation: bgShift 14s ease-in-out infinite;
        }
        @keyframes bgShift {
            0%,
            100% {
                opacity: 0.85;
                transform: scale(1) rotate(0deg);
            }
            25% {
                opacity: 1;
                transform: scale(1.06) rotate(1.5deg);
            }
            50% {
                opacity: 0.9;
                transform: scale(1.03) rotate(-1deg);
            }
            75% {
                opacity: 1;
                transform: scale(1.07) rotate(0.5deg);
            }
        }

        #particlesCanvas {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            opacity: 0.7;
        }

        .main-container {
            position: relative;
            z-index: 2;
            max-width: 1400px;
            margin: 0 auto;
            padding: 16px 20px 40px;
        }

        #loadingScreen {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: #06060f;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s ease, visibility 0.5s ease;
            opacity: 1;
            visibility: visible;
        }
        #loadingScreen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .loading-logo {
            font-family: var(--font-mono);
            font-size: 2.6rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple), var(--accent-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 20px;
            animation: loadPulse 1.6s ease-in-out infinite;
        }
        @keyframes loadPulse {
            0%,
            100% {
                filter: brightness(1);
            }
            50% {
                filter: brightness(1.5);
            }
        }
        .loading-bar-track {
            width: 240px;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
        }
        .loading-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple), var(--accent-pink));
            border-radius: 10px;
            width: 0%;
            animation: loadBar 1.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }
        @keyframes loadBar {
            0% {
                width: 0%;
            }
            60% {
                width: 75%;
            }
            90% {
                width: 94%;
            }
            100% {
                width: 100%;
            }
        }
        .loading-text {
            color: var(--text-muted);
            font-family: var(--font-mono);
            font-size: 0.8rem;
            margin-top: 12px;
            letter-spacing: 0.06em;
            animation: fadeText 1.5s ease-in-out infinite;
        }
        @keyframes fadeText {
            0%,
            100% {
                opacity: 0.4;
            }
            50% {
                opacity: 1;
            }
        }

        .glass-card {
            background: var(--bg-card);
            backdrop-filter: blur(var(--blur-amount)) saturate(var(--blur-saturate));
            -webkit-backdrop-filter: blur(var(--blur-amount)) saturate(var(--blur-saturate));
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-md);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.04);
            transition: all var(--transition-smooth);
            position: relative;
            overflow: hidden;
        }
        .glass-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            pointer-events: none;
            background: radial-gradient(ellipse at 30% 20%, rgba(140, 100, 255, 0.06) 0%, transparent 60%);
            opacity: 0;
            transition: opacity var(--transition-smooth);
        }
        .glass-card:hover::before {
            opacity: 1;
        }
        .glass-card:hover {
            border-color: var(--border-glow);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5), 0 0 30px rgba(140, 100, 255, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.06);
            transform: translateY(-2px);
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 14px;
            padding: 14px 20px;
            margin-bottom: 18px;
            border-radius: var(--radius-lg);
        }
        .header-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header-logo-icon {
            width: 42px;
            height: 42px;
            border-radius: var(--radius-sm);
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-cyan));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            box-shadow: var(--glow-purple);
            animation: logoGlow 2.5s ease-in-out infinite;
        }
        @keyframes logoGlow {
            0%,
            100% {
                box-shadow: 0 0 16px rgba(180, 77, 255, 0.4);
            }
            50% {
                box-shadow: 0 0 28px rgba(0, 229, 255, 0.55);
            }
        }
        .header-title {
            font-family: var(--font-mono);
            font-weight: 700;
            font-size: 1.25rem;
            letter-spacing: 0.03em;
            background: linear-gradient(135deg, #e0dff5, #c4b5fd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .header-subtitle {
            font-size: 0.7rem;
            color: var(--text-muted);
            letter-spacing: 0.05em;
            font-family: var(--font-mono);
        }
        .header-mining-badge {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 20px;
            background: rgba(0, 230, 118, 0.1);
            border: 1px solid rgba(0, 230, 118, 0.3);
            color: var(--accent-green);
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            text-shadow: 0 0 8px rgba(0, 230, 118, 0.5);
            box-shadow: 0 0 14px rgba(0, 230, 118, 0.15);
            animation: badgePulse 2.5s ease-in-out infinite;
            direction: rtl;
        }
        @keyframes badgePulse {
            0%,
            100% {
                box-shadow: 0 0 12px rgba(0, 230, 118, 0.2);
            }
            50% {
                box-shadow: 0 0 24px rgba(0, 230, 118, 0.4);
            }
        }
        .header-status-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--accent-green);
            box-shadow: 0 0 10px var(--accent-green), 0 0 20px rgba(0, 230, 118, 0.5);
            animation: dotPulse 2s ease-in-out infinite;
            display: inline-block;
            margin-right: 6px;
        }
        @keyframes dotPulse {
            0%,
            100% {
                box-shadow: 0 0 8px var(--accent-green), 0 0 18px rgba(0, 230, 118, 0.45);
            }
            50% {
                box-shadow: 0 0 20px var(--accent-green), 0 0 36px rgba(0, 230, 118, 0.7);
            }
        }

        .btn {
            font-family: var(--font-sans);
            font-size: 0.8rem;
            font-weight: 600;
            padding: 9px 17px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            cursor: pointer;
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-primary);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: all var(--transition-fast);
            letter-spacing: 0.02em;
            white-space: nowrap;
            position: relative;
            overflow: hidden;
            user-select: none;
        }
        .btn::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 24px;
            pointer-events: none;
            background: radial-gradient(circle at center, rgba(255, 255, 255, 0.2) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.35s ease;
        }
        .btn:hover::after {
            opacity: 1;
        }
        .btn:hover {
            border-color: rgba(255, 255, 255, 0.45);
            box-shadow: 0 0 20px rgba(140, 100, 255, 0.3);
            transform: translateY(-1px);
            background: rgba(255, 255, 255, 0.1);
        }
        .btn:active {
            transform: scale(0.96);
            transition: transform 0.1s ease;
        }
        .btn-primary {
            background: linear-gradient(135deg, rgba(140, 80, 255, 0.5), rgba(0, 200, 240, 0.45));
            border-color: rgba(180, 77, 255, 0.5);
            box-shadow: 0 0 14px rgba(140, 100, 255, 0.25);
        }
        .btn-danger {
            border-color: rgba(255, 61, 127, 0.4);
            color: #ff8a9e;
        }
        .btn-success {
            border-color: rgba(0, 230, 118, 0.4);
            color: #80f0b0;
        }
        .btn-sm {
            padding: 6px 12px;
            font-size: 0.7rem;
            border-radius: 18px;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(175px, 1fr));
            gap: 14px;
            margin-bottom: 18px;
        }
        .stat-card {
            padding: 16px 18px;
            text-align: center;
            cursor: default;
        }
        .stat-card .stat-icon {
            font-size: 1.6rem;
            margin-bottom: 6px;
        }
        .stat-card .stat-value {
            font-family: var(--font-mono);
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 0.02em;
            color: var(--accent-cyan);
            text-shadow: var(--glow-cyan);
        }
        .stat-card .stat-label {
            font-size: 0.68rem;
            color: var(--text-muted);
            letter-spacing: 0.04em;
            text-transform: uppercase;
            margin-top: 2px;
        }
        .stat-card.status-active .stat-value {
            color: var(--accent-green);
            text-shadow: 0 0 14px rgba(0, 230, 118, 0.5);
        }
        .stat-card.status-inactive .stat-value {
            color: var(--accent-red);
            text-shadow: 0 0 14px rgba(255, 23, 68, 0.5);
        }

        .console-section {
            margin-bottom: 18px;
        }
        .console-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-glass);
            border-radius: var(--radius-md) var(--radius-md) 0 0;
            background: rgba(0, 0, 0, 0.2);
        }
        .console-title {
            font-family: var(--font-mono);
            font-weight: 600;
            font-size: 0.85rem;
            letter-spacing: 0.03em;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .console-badge {
            font-size: 0.65rem;
            padding: 3px 9px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.08);
            font-family: var(--font-mono);
            letter-spacing: 0.04em;
        }
        .console-body {
            max-height: 380px;
            overflow-y: auto;
            padding: 12px 14px;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            line-height: 1.65;
            border-radius: 0 0 var(--radius-md) var(--radius-md);
            background: rgba(6, 6, 18, 0.7);
        }
        .console-line {
            padding: 3px 8px;
            border-radius: 4px;
            margin-bottom: 2px;
            word-break: break-all;
            transition: background var(--transition-fast);
            animation: fadeInLine 0.25s ease;
        }
        @keyframes fadeInLine {
            from {
                opacity: 0;
                transform: translateY(-6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .console-line .ts {
            color: #6a6888;
            margin-right: 8px;
            font-size: 0.68rem;
            white-space: nowrap;
        }
        .console-line.log {
            color: #c8c6e0;
        }
        .console-line.warn {
            color: #ffb74d;
            background: rgba(255, 193, 7, 0.06);
        }
        .console-line.error {
            color: #ff6e7f;
            background: rgba(255, 23, 68, 0.08);
        }
        .console-line.info {
            color: #80deea;
        }
        .console-line.debug {
            color: #9e9eb8;
            font-style: italic;
        }
        .console-filter-btn {
            font-size: 0.65rem;
            padding: 4px 10px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            font-family: var(--font-mono);
            transition: all var(--transition-fast);
            letter-spacing: 0.03em;
        }
        .console-filter-btn.active {
            background: rgba(140, 100, 255, 0.25);
            border-color: var(--accent-purple);
            color: #fff;
            box-shadow: 0 0 8px rgba(140, 100, 255, 0.3);
        }
        .console-filter-btn:hover {
            border-color: rgba(255, 255, 255, 0.4);
        }
        .console-search {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-glass);
            border-radius: 16px;
            padding: 6px 12px;
            color: white;
            font-family: var(--font-mono);
            font-size: 0.7rem;
            width: 140px;
            transition: var(--transition-fast);
        }
        .console-search:focus {
            outline: none;
            border-color: var(--accent-purple);
            box-shadow: 0 0 12px rgba(140, 100, 255, 0.4);
        }

        .controls-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 18px;
        }

        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9998;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
        }
        .toast {
            padding: 12px 20px;
            border-radius: 24px;
            background: rgba(20, 20, 40, 0.8);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--border-glass);
            color: white;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            animation: slideInToast 0.3s ease;
            pointer-events: auto;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        @keyframes slideInToast {
            from {
                opacity: 0;
                transform: translateX(40px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        .toast.success {
            border-left: 3px solid var(--accent-green);
        }
        .toast.error {
            border-left: 3px solid var(--accent-red);
        }
        .toast.warning {
            border-left: 3px solid var(--accent-orange);
        }

        footer {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.7rem;
            margin-top: 10px;
            opacity: 0.7;
        }

        @media (max-width: 768px) {
            .dashboard-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            }
            .header-mining-badge {
                font-size: 0.65rem;
                padding: 4px 10px;
            }
        }
    </style>
</head>
<body>
    <div class="bg-gradient-layer"></div>
    <canvas id="particlesCanvas"></canvas>

    <div id="loadingScreen">
        <div class="loading-logo">EARNIFY</div>
        <div class="loading-bar-track"><div class="loading-bar-fill"></div></div>
        <div class="loading-text">INITIALIZING NODE</div>
    </div>

    <div class="main-container">
        <header class="header glass-card">
            <div class="header-brand">
                <div class="header-logo-icon">⚛️</div>
                <div>
                    <div class="header-title">Earnify Miner</div>
                    <div class="header-subtitle">Cyber Dashboard v2.4</div>
                </div>
            </div>
            <div class="header-mining-badge">
                <span class="header-status-dot"></span> در حال ماینینگ (کنسول مرورگر خود را باز کنید)
            </div>
        </header>

        <div class="dashboard-grid" id="dashboardGrid"></div>

        <div class="controls-row">
            <button class="btn btn-primary" id="btnStart">▶ Start</button>
            <button class="btn" id="btnReload">↻ Reload</button>
            <button class="btn btn-danger" id="btnClearConsole">⌫ Clear Console</button>
            <button class="btn" id="btnCopyLogs">📋 Copy Logs</button>
            <button class="btn" id="btnDownloadLogs">⬇ Download TXT</button>
            <button class="btn" id="btnThemeToggle">🌓 Theme</button>
            <button class="btn" id="btnFullscreen">⛶ Fullscreen</button>
        </div>

        <div class="console-section glass-card">
            <div class="console-header">
                <div class="console-title">
                    <span>🖥️ CONSOLE</span>
                    <span class="console-badge" id="logCounter">0 logs</span>
                    <span class="console-badge" id="errorCounter" style="color:#ff6e7f;">0 errors</span>
                </div>
                <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
                    <button class="console-filter-btn active" data-filter="all">ALL</button>
                    <button class="console-filter-btn" data-filter="log">LOG</button>
                    <button class="console-filter-btn" data-filter="warn">WARN</button>
                    <button class="console-filter-btn" data-filter="error">ERROR</button>
                    <button class="console-filter-btn" data-filter="info">INFO</button>
                    <button class="console-filter-btn" data-filter="debug">DEBUG</button>
                    <input type="text" class="console-search" placeholder="Search..." id="consoleSearch">
                    <button class="btn btn-sm" id="btnPauseConsole">⏸️ Pause</button>
                    <button class="btn btn-sm" id="btnResumeConsole" style="display:none;">▶ Resume</button>
                </div>
            </div>
            <div class="console-body" id="consoleBody"></div>
        </div>

        <footer>© 2026 Earnify Node · All systems nominal</footer>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script>
        (function() {
            'use strict';

            // ---------- SAFE WRAPPERS ----------
            function safeExec(fn, context = 'anonymous') {
                try { fn(); } catch (e) { console.error(`[${context}] ${e.message}`); }
            }

            // ---------- LOADING SCREEN ----------
            window.addEventListener('load', () => {
                setTimeout(() => {
                    document.getElementById('loadingScreen').classList.add('hidden');
                }, 2200);
            });

            // ---------- PARTICLES ----------
            const canvas = document.getElementById('particlesCanvas');
            const ctx = canvas.getContext('2d');
            let particles = [];
            let animationId;

            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            class Particle {
                constructor() { this.reset(); }
                reset() {
                    this.x = Math.random() * canvas.width;
                    this.y = Math.random() * canvas.height;
                    this.radius = Math.random() * 2.5 + 0.8;
                    this.speedX = (Math.random() - 0.5) * 0.4;
                    this.speedY = (Math.random() - 0.5) * 0.4;
                    this.opacity = Math.random() * 0.6 + 0.2;
                    this.color = Math.random() < 0.3 ? '180,77,255' : '0,229,255';
                }
                update() {
                    this.x += this.speedX;
                    this.y += this.speedY;
                    if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
                    if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
                }
                draw() {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(${this.color}, ${this.opacity})`;
                    ctx.shadowColor = `rgba(${this.color}, 0.7)`;
                    ctx.shadowBlur = 8;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }
            }

            function initParticles(count = 70) {
                particles = Array.from({ length: count }, () => new Particle());
            }
            function animateParticles() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particles.forEach(p => { p.update(); p.draw(); });
                animationId = requestAnimationFrame(animateParticles);
            }
            initParticles();
            animateParticles();

            // ---------- CONSOLE HOOKING ----------
            const consoleBody = document.getElementById('consoleBody');
            const logCounterSpan = document.getElementById('logCounter');
            const errorCounterSpan = document.getElementById('errorCounter');
            let logs = [];
            let logCount = 0;
            let errorCount = 0;
            let consolePaused = false;
            let currentFilter = 'all';
            let searchTerm = '';

            const originalConsole = {
                log: console.log.bind(console),
                warn: console.warn.bind(console),
                error: console.error.bind(console),
                info: console.info.bind(console),
                debug: console.debug.bind(console)
            };

            function timestamp() {
                return new Date().toISOString().split('T')[1].slice(0, 12);
            }

            function addLogLine(type, args) {
                if (consolePaused) return;
                const msg = args.map(a => (typeof a === 'object' ? JSON.stringify(a, null, 0) : String(a))).join(' ');
                const line = { type, msg, ts: timestamp() };
                logs.push(line);
                if (type === 'error') errorCount++;
                logCount++;
                updateCounters();
                renderLogLine(line);
                autoScrollConsole();
            }

            function renderLogLine(line) {
                if (!matchesFilter(line.type)) return;
                if (searchTerm && !line.msg.toLowerCase().includes(searchTerm.toLowerCase())) return;
                const div = document.createElement('div');
                div.className = `console-line ${line.type}`;
                div.innerHTML = `<span class="ts">[${line.ts}]</span>${escapeHtml(line.msg)}`;
                consoleBody.appendChild(div);
            }

            function escapeHtml(text) {
                return String(text).replace(/[&<>"]/g, function(m) {
                    if (m === '&') return '&amp;';
                    if (m === '<') return '&lt;';
                    if (m === '>') return '&gt;';
                    if (m === '"') return '&quot;';
                    return m;
                });
            }

            function matchesFilter(type) {
                return currentFilter === 'all' || type === currentFilter;
            }

            function autoScrollConsole() {
                consoleBody.scrollTop = consoleBody.scrollHeight;
            }

            function updateCounters() {
                logCounterSpan.textContent = `${logCount} logs`;
                errorCounterSpan.textContent = `${errorCount} errors`;
            }

            function reRenderConsole() {
                consoleBody.innerHTML = '';
                logs.forEach(line => {
                    if (matchesFilter(line.type) && (!searchTerm || line.msg.toLowerCase().includes(searchTerm.toLowerCase()))) {
                        renderLogLine(line);
                    }
                });
                autoScrollConsole();
            }

            // Override console methods
            ['log', 'warn', 'error', 'info', 'debug'].forEach(method => {
                console[method] = function(...args) {
                    originalConsole[method](...args);
                    addLogLine(method === 'warn' ? 'warn' : method, args);
                };
            });

            // Global error handlers
            window.onerror = function(message, source, lineno, colno, error) {
                const msg = `Uncaught Error: ${message} at ${source}:${lineno}:${colno}`;
                originalConsole.error(msg);
                addLogLine('error', [msg]);
            };
            window.addEventListener('unhandledrejection', function(event) {
                const msg = `Unhandled Promise: ${event.reason}`;
                originalConsole.error(msg);
                addLogLine('error', [msg]);
            });

            // ---------- DASHBOARD CARDS ----------
            function updateDashboard() {
                const grid = document.getElementById('dashboardGrid');
                if (!grid) return;
                const status = navigator.onLine ? 'Online' : 'Offline';
                const visibility = document.visibilityState === 'visible' ? 'Visible' : 'Hidden';
                const cpuThreads = navigator.hardwareConcurrency || 'Unknown';
                const memory = navigator.deviceMemory ? `${navigator.deviceMemory} GB` : 'N/A';
                const platform = navigator.platform || 'Unknown';
                const language = navigator.language || 'Unknown';
                const resolution = `${screen.width}x${screen.height}`;
                const browser = (navigator.userAgentData?.brands?.[0]?.brand || navigator.appName) + ' ' + (navigator.userAgentData?.platform || '');

                const cards = [
                    { icon: '⛏️', label: 'MINER STATUS', value: 'Active', cls: 'status-active' },
                    { icon: '⏱️', label: 'UPTIME', value: '00:00:00', id: 'uptimeValue' },
                    { icon: '🕒', label: 'CURRENT TIME', value: new Date().toLocaleTimeString(), id: 'timeValue' },
                    { icon: '🌐', label: 'BROWSER', value: browser },
                    { icon: '💻', label: 'PLATFORM', value: platform },
                    { icon: '🗣️', label: 'LANGUAGE', value: language },
                    { icon: '🧵', label: 'CPU THREADS', value: cpuThreads },
                    { icon: '🧠', label: 'DEVICE MEMORY', value: memory },
                    { icon: '📶', label: 'ONLINE', value: status, cls: status === 'Online' ? 'status-active' : 'status-inactive' },
                    { icon: '👁️', label: 'VISIBILITY', value: visibility },
                    { icon: '📺', label: 'RESOLUTION', value: resolution }
                ];

                grid.innerHTML = cards.map(c => `
                    <div class="glass-card stat-card ${c.cls || ''}">
                        <div class="stat-icon">${c.icon}</div>
                        <div class="stat-value" ${c.id ? `id="${c.id}"` : ''}>${c.value}</div>
                        <div class="stat-label">${c.label}</div>
                    </div>
                `).join('');
            }
            updateDashboard();

            // Live statistics refresh
            let startTime = Date.now();
            function updateLiveStats() {
                const uptimeEl = document.getElementById('uptimeValue');
                const timeEl = document.getElementById('timeValue');
                if (uptimeEl) {
                    const diff = Math.floor((Date.now() - startTime) / 1000);
                    const h = String(Math.floor(diff / 3600)).padStart(2, '0');
                    const m = String(Math.floor((diff % 3600) / 60)).padStart(2, '0');
                    const s = String(diff % 60).padStart(2, '0');
                    uptimeEl.textContent = `${h}:${m}:${s}`;
                }
                if (timeEl) timeEl.textContent = new Date().toLocaleTimeString();
                requestAnimationFrame(() => setTimeout(updateLiveStats, 1000));
            }
            updateLiveStats();

            // ---------- TOAST NOTIFICATIONS ----------
            function showToast(message, type = 'info') {
                const container = document.getElementById('toastContainer');
                const toast = document.createElement('div');
                toast.className = `toast ${type}`;
                toast.textContent = message;
                container.appendChild(toast);
                setTimeout(() => toast.remove(), 3200);
            }

            // ---------- BUTTON HANDLERS ----------
            document.getElementById('btnStart').addEventListener('click', () => {
                showToast('Miner already running (auto-start)', 'success');
                addLogLine('info', ['Miner start triggered by user.']);
            });
            document.getElementById('btnReload').addEventListener('click', () => location.reload());
            document.getElementById('btnClearConsole').addEventListener('click', () => {
                logs = [];
                logCount = 0;
                errorCount = 0;
                consoleBody.innerHTML = '';
                updateCounters();
                showToast('Console cleared', 'info');
            });
            document.getElementById('btnCopyLogs').addEventListener('click', () => {
                const text = logs.map(l => `[${l.ts}] [${l.type.toUpperCase()}] ${l.msg}`).join('\n');
                navigator.clipboard.writeText(text).then(() => showToast('Logs copied', 'success')).catch(() => showToast('Copy failed', 'error'));
            });
            document.getElementById('btnDownloadLogs').addEventListener('click', () => {
                const text = logs.map(l => `[${l.ts}] [${l.type.toUpperCase()}] ${l.msg}`).join('\n');
                const blob = new Blob([text], { type: 'text/plain' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = `earnify-logs-${Date.now()}.txt`;
                a.click();
                showToast('Logs downloaded', 'success');
            });
            document.getElementById('btnThemeToggle').addEventListener('click', () => {
                document.body.style.filter = document.body.style.filter === 'invert(1) hue-rotate(180deg)' ? '' : 'invert(1) hue-rotate(180deg)';
                showToast('Theme toggled', 'info');
            });
            document.getElementById('btnFullscreen').addEventListener('click', () => {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(() => {});
                } else {
                    document.exitFullscreen();
                }
            });

            // Console filter buttons
            document.querySelectorAll('.console-filter-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.console-filter-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentFilter = btn.dataset.filter;
                    reRenderConsole();
                });
            });

            document.getElementById('consoleSearch').addEventListener('input', (e) => {
                searchTerm = e.target.value;
                reRenderConsole();
            });

            const btnPause = document.getElementById('btnPauseConsole');
            const btnResume = document.getElementById('btnResumeConsole');
            btnPause.addEventListener('click', () => {
                consolePaused = true;
                btnPause.style.display = 'none';
                btnResume.style.display = 'inline-block';
                showToast('Console paused', 'warning');
            });
            btnResume.addEventListener('click', () => {
                consolePaused = false;
                btnPause.style.display = 'inline-block';
                btnResume.style.display = 'none';
                showToast('Console resumed', 'success');
            });

            // Initial log message
            addLogLine('info', ['Dashboard initialized. Miner starting...']);
        })();
    </script>
