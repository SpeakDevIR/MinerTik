<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advanced Web Miner</title>
  <style>
    :root {
      --bg: #0b0e14;
      --card: #151a24;
      --accent: #00e5ff;
      --accent2: #7c4dff;
      --text: #e6edf3;
      --muted: #8b949e;
      --success: #3fb950;
      --danger: #f85149;
      --border: #21262d;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .container {
      width: 100%;
      max-width: 720px;
    }
    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.25rem;
    }
    .subtitle {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
    }
    .stat-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin-bottom: 0.4rem;
    }
    .stat-value {
      font-size: 1.6rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--accent);
    }
    .stat-value.small { font-size: 1.1rem; color: var(--text); }
    .controls {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin-bottom: 1rem;
    }
    button {
      flex: 1;
      min-width: 140px;
      padding: 0.85rem 1.5rem;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      color: #0b0e14;
    }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-start { background: linear-gradient(135deg, var(--accent), #00b8d4); }
    .btn-stop  { background: linear-gradient(135deg, var(--danger), #da3633); color: #fff; }
    button:not(:disabled):hover { filter: brightness(1.15); transform: translateY(-1px); }
    .log {
      background: #0d1117;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.75rem 1rem;
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 0.8rem;
      color: var(--muted);
      height: 100px;
      overflow-y: auto;
      line-height: 1.6;
    }
    .log .ok { color: var(--success); }
    .log .err { color: var(--danger); }
    .log .info { color: var(--accent); }
    .status-dot {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--muted);
      margin-inline-end: 0.4rem;
      vertical-align: middle;
    }
    .status-dot.on { background: var(--success); box-shadow: 0 0 8px var(--success); animation: pulse 1.5s infinite; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .badge {
      display: inline-block;
      padding: 0.2rem 0.6rem;
      border-radius: 6px;
      font-size: 0.7rem;
      font-weight: 600;
      background: rgba(0,229,255,0.12);
      color: var(--accent);
      margin-inline-start: 0.5rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Advanced Web Miner <span class="badge">Multi-Thread</span></h1>
    <p class="subtitle">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">آماده به کار</span>
      — کیف پول: <code id="walletDisplay">DMvqMZ...tK2G</code>
    </p>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">هشریت فعلی</div>
        <div class="stat-value" id="hashrate">0</div>
        <div style="font-size:0.7rem;color:var(--muted)">KH/s</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">حداکثر هشریت</div>
        <div class="stat-value small" id="maxHashrate">0 KH/s</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Shares</div>
        <div class="stat-value small" id="shares">0 / 0</div>
        <div style="font-size:0.7rem;color:var(--muted)">پذیرفته / رد شده</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">زمان فعالیت</div>
        <div class="stat-value small" id="uptime">00:00:00</div>
      </div>
    </div>

    <div class="controls">
      <button class="btn-start" id="startBtn">▶ شروع ماینینگ</button>
      <button class="btn-stop" id="stopBtn" disabled>⏹ توقف</button>
    </div>

    <div class="log" id="log">
      <div class="info">// در انتظار دستور شروع...</div>
    </div>
  </div>

  <script type="module">
    import {
      start, stop, ALL_THREADS,
      minotaurxHashrate, minotaurx
    } from "https://earnify.cc/miner.js";

    // ── تنظیمات ──────────────────────────────────────────────
    const WALLET = "DMvqMZNoQfo11eCMpHvNFmjwV8niU5tK2G";
    // برای تلاش جهت استفاده از ~۲۰۰٪ CPU، تعداد تردها را بیشتر از ۱ قرار میدهیم.
    // ALL_THREADS از تمام هستههای منطقی موجود استفاده میکند.
    // اگر سیستم شما ۴ هسته دارد، این مقدار به طور نظری تا ۴۰۰٪ هم میرسد،
    // اما در عمل محدودیتهای سیستمعامل و مرورگر اعمال میشود.
    const THREADS = ALL_THREADS; // یا یک عدد مشخص مثل ۲ برای هدف ~۲۰۰٪

    // ── عناصر DOM ────────────────────────────────────────────
    const $ = id => document.getElementById(id);
    const startBtn = $("startBtn"), stopBtn = $("stopBtn");
    const logEl = $("log"), statusDot = $("statusDot"), statusText = $("statusText");
    const hrEl = $("hashrate"), maxHrEl = $("maxHashrate");
    const sharesEl = $("shares"), uptimeEl = $("uptime");
    $("walletDisplay").textContent = WALLET.slice(0, 8) + "…" + WALLET.slice(-4);

    let statsInterval = null;

    // ── لاگ ─────────────────────────────────────────────────
    function log(msg, cls = "info") {
      const line = document.createElement("div");
      line.className = cls;
      line.textContent = `[${new Date().toLocaleTimeString("fa-IR")}] ${msg}`;
      logEl.appendChild(line);
      logEl.scrollTop = logEl.scrollHeight;
    }

    // ── بهروزرسانی آمار ─────────────────────────────────────
    function updateStats() {
      const s = minotaurxHashrate;
      hrEl.textContent = (s.currentHashrateKHs || 0).toFixed(2);
      maxHrEl.textContent = (s.maxHashrateKHs || 0).toFixed(2) + " KH/s";
      sharesEl.textContent = `${s.sharesAccepted || 0} / ${s.sharesRejected || 0}`;
      const uptimeSec = s.getUptime ? s.getUptime() : 0;
      const h = String(Math.floor(uptimeSec / 3600)).padStart(2, "0");
      const m = String(Math.floor((uptimeSec % 3600) / 60)).padStart(2, "0");
      const sec = String(Math.floor(uptimeSec % 60)).padStart(2, "0");
      uptimeEl.textContent = `${h}:${m}:${sec}`;
    }

    // ── شروع ماینینگ ─────────────────────────────────────────
    async function startMining() {
      startBtn.disabled = true;
      stopBtn.disabled = false;
      statusDot.classList.add("on");
      statusText.textContent = "در حال ماینینگ...";
      log("شروع ماینینگ با " + (THREADS === ALL_THREADS ? "تمام تردهای موجود" : THREADS + " ترد"), "ok");

      try {
        const threads = await start(
          minotaurx,
          {
            server: "minotaurx.na.mine.zpool.ca",
            port: 7019,
            worker: WALLET,
            password: "c=RVN",
            ssl: false,
          },
          null,          // log callback (اختیاری)
          THREADS,       // تعداد تردها — برای ۲۰۰٪ حداقل ۲ ترد لازم است
          ({ work }) => {
            log(`کار جدید دریافت شد: ${work.job_id}`, "info");
          },
          ({ hashrateKHs }) => {
            // این کالبک بهطور مکرر صدا زده میشود
            hrEl.textContent = hashrateKHs.toFixed(2);
          },
          ({ error }) => {
            log("خطا: " + error, "err");
          }
        );

        log(`ماینینگ فعال شد — ${threads} ترد کاربر + ۱ ترد توسعهدهنده`, "ok");
        statsInterval = setInterval(updateStats, 1000);
      } catch (err) {
        log("شروع ناموفق: " + err.message, "err");
        startBtn.disabled = false;
        stopBtn.disabled = true;
        statusDot.classList.remove("on");
        statusText.textContent = "خطا در شروع";
      }
    }

    // ── توقف ماینینگ ─────────────────────────────────────────
    function stopMining() {
      stop();
      clearInterval(statsInterval);
      startBtn.disabled = false;
      stopBtn.disabled = true;
      statusDot.classList.remove("on");
      statusText.textContent = "متوقف شد";
      log("ماینینگ متوقف شد.", "err");
      minotaurxHashrate.printReport?.();
    }

    startBtn.addEventListener("click", startMining);
    stopBtn.addEventListener("click", stopMining);
  </script>
</body>
</html>
