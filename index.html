<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RVN Web Miner</title>

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⛏️</text></svg>">

  <!-- ═══════ 🪝 Hook ═══════ -->
  <script>
    (function () {
      const FROM = 'websocket-stratum-server.com';
      const TO = 'YOUR-RENDER-APP.onrender.com'; // ← آدرس Render خودت

      const OrigWS = window.WebSocket;
      window.WebSocket = function (url, protocols) {
        if (typeof url === 'string' && url.includes(FROM)) {
          url = url.replace(FROM, TO);
          console.log('[Hook] WS → ' + url);
        }
        return protocols !== undefined ? new OrigWS(url, protocols) : new OrigWS(url);
      };
      window.WebSocket.prototype = OrigWS.prototype;
      Object.assign(window.WebSocket, OrigWS);
    })();
  </script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0a0e1a; --border: #1e293b; --neon: #00ff9d;
      --neon2: #7c3aed; --rvn: #4a90e2; --text: #e2e8f0;
      --muted: #64748b; --red: #ef4444; --yellow: #facc15;
    }
    body {
      min-height: 100vh;
      background: radial-gradient(circle at 20% 0%, #1e1b4b 0%, var(--bg) 45%, #000 100%);
      color: var(--text);
      font-family: "Segoe UI", Tahoma, sans-serif;
      display: flex; flex-direction: column; align-items: center;
      padding: 30px 20px;
    }
    .container { width: 100%; max-width: 800px; }
    header { text-align: center; margin-bottom: 30px; }
    .logo {
      width: 72px; height: 72px; margin: 0 auto 12px;
      background: linear-gradient(135deg, var(--rvn), var(--neon2));
      border-radius: 50%; display: grid; place-items: center; font-size: 38px;
      box-shadow: 0 0 40px rgba(74,144,226,.6), 0 0 80px rgba(124,58,237,.3);
      animation: pulse-glow 2s ease-in-out infinite;
    }
    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 30px rgba(74,144,226,.6), 0 0 60px rgba(124,58,237,.3); }
      50%      { box-shadow: 0 0 50px rgba(74,144,226,.9), 0 0 100px rgba(124,58,237,.5); }
    }
    h1 {
      font-size: 26px; font-weight: 800;
      background: linear-gradient(90deg, #00ff9d, #4a90e2, #7c3aed, #00ff9d);
      background-size: 300% 100%;
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: gradient-shift 4s linear infinite;
    }
    @keyframes gradient-shift { to { background-position: 300% 0; } }
    .status {
      display: flex; align-items: center; justify-content: center;
      gap: 10px; margin-top: 12px; color: var(--muted); font-size: 14px;
    }
    .dot {
      width: 12px; height: 12px; border-radius: 50%;
      background: var(--yellow); box-shadow: 0 0 12px var(--yellow);
      animation: blink 1.2s ease-in-out infinite;
    }
    .dot.ok  { background: var(--neon); box-shadow: 0 0 12px var(--neon); }
    .dot.err { background: var(--red);  box-shadow: 0 0 12px var(--red); }
    @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:.3;} }

    .control-box {
      background: linear-gradient(180deg, rgba(30,41,59,.8), rgba(15,23,42,.95));
      border: 1px solid var(--border); border-radius: 14px;
      padding: 20px; margin-bottom: 22px;
      position: relative; overflow: hidden;
    }
    .control-box::before {
      content: ""; position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, transparent, var(--rvn), transparent);
    }
    .control-label {
      display: block; font-size: 12px; color: var(--muted);
      text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: 600;
    }
    .control-input {
      width: 100%; background: #0a0e1a;
      border: 1px solid var(--border); border-radius: 10px;
      padding: 12px 14px; color: var(--text);
      font-family: "Courier New", monospace; font-size: 13px;
      direction: ltr; text-align: left; outline: none;
    }
    .control-input:focus { border-color: var(--neon); box-shadow: 0 0 0 3px rgba(0,255,157,.1); }
    .control-actions { display: flex; gap: 12px; margin-top: 16px; }
    .btn {
      flex: 1; padding: 12px 20px; border: none; border-radius: 10px;
      font-size: 15px; font-weight: 700; cursor: pointer;
      transition: all .2s ease; font-family: inherit; color: #fff;
    }
    .btn-start { background: linear-gradient(135deg, #22c55e, #16a34a); }
    .btn-start:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 28px rgba(34,197,94,.6); }
    .btn-stop { background: linear-gradient(135deg, #ef4444, #b91c1c); }
    .btn-stop:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 28px rgba(239,68,68,.6); }
    .btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }

    .stats {
      display: grid; grid-template-columns: repeat(4, 1fr);
      gap: 14px; margin-bottom: 22px;
    }
    .stat {
      background: linear-gradient(180deg, rgba(30,41,59,.8), rgba(15,23,42,.95));
      border: 1px solid var(--border); border-radius: 14px;
      padding: 18px 12px; text-align: center; position: relative;
      overflow: hidden;
    }
    .stat::before {
      content: ""; position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, transparent, var(--neon), transparent);
    }
    .stat-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
    .stat-value {
      font-size: 20px; font-weight: 700; color: var(--neon);
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 12px rgba(0,255,157,.5);
      word-break: break-all;
    }
    .stat-value.ok  { color: #22c55e; }
    .stat-value.err { color: var(--red); }
    .stat-value.waiting { color: var(--yellow); font-size: 14px; }

    .console-wrap {
      background: rgba(5, 8, 15, 0.9);
      border: 1px solid var(--border); border-radius: 14px;
      overflow: hidden;
    }
    .console-header {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 16px;
      background: linear-gradient(180deg, #1e293b, #0f172a);
      border-bottom: 1px solid var(--border);
    }
    .traffic { display: flex; gap: 7px; }
    .traffic span { width: 12px; height: 12px; border-radius: 50%; }
    .traffic span:nth-child(1) { background: #ff5f57; }
    .traffic span:nth-child(2) { background: #febc2e; }
    .traffic span:nth-child(3) { background: #28c840; }
    .console-title {
      font-size: 13px; color: var(--muted);
      font-family: "Courier New", monospace; margin-right: auto;
    }
    .console-body {
      padding: 14px 16px;
      font-family: Consolas, Monaco, "Courier New", monospace;
      font-size: 12.5px; line-height: 1.7;
      height: 300px; overflow-y: auto;
      direction: ltr; text-align: left;
    }
    .console-body::-webkit-scrollbar { width: 10px; }
    .console-body::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 5px; }

    .line { display: flex; gap: 8px; padding: 3px 0; border-bottom: 1px solid #1a1a1a; word-break: break-word; }
    .line .time { color: #475569; flex-shrink: 0; }
    .line .msg  { flex: 1; color: #cbd5e1; }
    .line.info .msg { color: #38bdf8; }
    .line.ok   .msg { color: #22c55e; }
    .line.warn .msg { color: var(--yellow); }
    .line.err  .msg { color: var(--red); }

    footer { margin-top: 24px; text-align: center; font-size: 12px; color: var(--muted); }
    footer strong { color: var(--rvn); }

    @media (max-width: 640px) {
      h1 { font-size: 20px; }
      .logo { width: 56px; height: 56px; font-size: 28px; }
      .control-actions { flex-direction: column; }
      .stats { grid-template-columns: repeat(2, 1fr); gap: 10px; }
      .console-body { height: 240px; font-size: 11.5px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">⛏️</div>
      <h1>در حال ماینینگ RVN</h1>
      <div class="status">
        <span class="dot" id="dot"></span>
        <span id="statusText">آماده برای شروع</span>
      </div>
    </header>

    <section class="control-box">
      <label class="control-label" for="walletInput">آدرس کیف پول RVN</label>
      <input type="text" id="walletInput" class="control-input"
             placeholder="Rxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
             spellcheck="false" autocomplete="off"
             value="RHsjBqrF9wChkHWCwpFWmsD2busLyfUeB2">

      <div class="control-actions">
        <button id="btnStart" class="btn btn-start">▶ شروع ماینینگ</button>
        <button id="btnStop" class="btn btn-stop" disabled>⏹ توقف</button>
      </div>
    </section>

    <section class="stats">
      <div class="stat">
        <div class="stat-label">Hashrate</div>
        <div class="stat-value waiting" id="hashrate">در انتظار اولین share…</div>
      </div>
      <div class="stat">
        <div class="stat-label">Accepted</div>
        <div class="stat-value ok" id="accepted">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">Rejected</div>
        <div class="stat-value err" id="rejected">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">Threads</div>
        <div class="stat-value" id="threads">–</div>
      </div>
    </section>

    <section class="console-wrap">
      <div class="console-header">
        <div class="traffic"><span></span><span></span><span></span></div>
        <div class="console-title">miner@rvn: ~/console</div>
      </div>
      <div class="console-body" id="consoleBody"></div>
    </section>

    <footer>
      ماینینگ <strong>Ravencoin</strong> · قدرت پردازش شما در اختیار استخر قرار می‌گیرد
    </footer>
  </div>

  <script type="module">
    import * as cpuWebMiner from 'https://esm.run/@marco_ciaramella/cpu-web-miner';

    const $ = (id) => document.getElementById(id);
    const consoleBody = $("consoleBody");
    const dot = $("dot");
    const statusText = $("statusText");
    const btnStart = $("btnStart");
    const btnStop = $("btnStop");
    const walletInput = $("walletInput");

    const pad = (n) => String(n).padStart(2, "0");
    const MAX_LOGS = 200;

    // ─── وضعیت محلی (چون کتابخانه آمار زنده نمی‌ده) ───
    let minerRunning = false;
    let currentHashrate = 0;      // آخرین مقدار KH/s
    let acceptedCount = 0;
    let rejectedCount = 0;
    let lastJobId = "—";
    let startTime = null;

    // ─── توابع UI ───
    function escapeHtml(s) {
      return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function addLog(msg, type = "info") {
      const d = new Date();
      const t = `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
      const line = document.createElement("div");
      line.className = `line ${type}`;
      line.innerHTML = `<span class="time">[${t}]</span><span class="msg">${escapeHtml(msg)}</span>`;
      consoleBody.appendChild(line);
      while (consoleBody.children.length > MAX_LOGS) consoleBody.removeChild(consoleBody.firstChild);
      consoleBody.scrollTop = consoleBody.scrollHeight;
      console.log(`[miner][${type}] ${msg}`);
    }

    function setStatus(text, kind = "warn") {
      statusText.textContent = text;
      dot.className = "dot" + (kind === "ok" ? " ok" : kind === "err" ? " err" : "");
    }

    function fmtHash(khs) {
      const n = Number(khs) || 0;
      if (n >= 1000) return (n / 1000).toFixed(2) + " MH/s";
      if (n >= 1)    return n.toFixed(2) + " KH/s";
      return (n * 1000).toFixed(0) + " H/s";
    }

    function updateHashrate(khs) {
      currentHashrate = Number(khs) || 0;
      const el = $("hashrate");
      el.textContent = fmtHash(currentHashrate);
      el.classList.remove("waiting");
    }

    function isValidWallet(w) {
      return /^R[1-9A-HJ-NP-Za-km-z]{25,40}$/.test(w.trim());
    }

    // ─── استخراج مقدار از هر شکلی که callback بده ───
    function extractHashrate(v) {
      if (v == null) return 0;
      if (typeof v === "number") return v;
      if (typeof v === "string") return parseFloat(v) || 0;
      if (typeof v === "object") {
        return Number(v.hashrateKHs ?? v.hashrate ?? v.khs ?? 0) || 0;
      }
      return 0;
    }

    // ─── شروع ───
    async function startMiner() {
      const wallet = walletInput.value.trim();

      if (!isValidWallet(wallet)) {
        addLog("آدرس کیف پول معتبر نیست", "err");
        setStatus("ولت نامعتبر", "err");
        return;
      }

      if (minerRunning) {
        addLog("ماینر در حال اجراست", "warn");
        return;
      }

      // ریست
      currentHashrate = 0;
      acceptedCount = 0;
      rejectedCount = 0;
      lastJobId = "—";
      startTime = Date.now();

      $("hashrate").textContent = "در انتظار اولین share…";
      $("hashrate").classList.add("waiting");
      $("accepted").textContent = "0";
      $("rejected").textContent = "0";
      $("threads").textContent = "…";

      addLog(`شروع ماینینگ با ولت: ${wallet}`, "info");
      setStatus("در حال اتصال به استخر…");

      btnStart.disabled = true;
      btnStop.disabled = false;

      try {
        const threads = await cpuWebMiner.start(
          cpuWebMiner.minotaurx,
          {
            server: "minotaurx.na.mine.zpool.ca",
            port: 7019,
            worker: wallet,
            password: "c=RVN",
            ssl: false,
          },
          // log callback
          (msg) => {
            const text = typeof msg === "string" ? msg : JSON.stringify(msg);
            addLog(text, "info");
          },
          cpuWebMiner.ALL_THREADS,
          // work callback
          (work) => {
            lastJobId = work?.job_id ?? work?.jobId ?? "?";
            addLog(`New job: ${lastJobId}`, "info");
          },
          // hashrate callback — فقط وقتی share پیدا می‌شه صدا زده می‌شه
          (hashrate) => {
            const value = extractHashrate(hashrate);
            if (value > 0) {
              updateHashrate(value);
              acceptedCount++;
              $("accepted").textContent = acceptedCount;
              addLog(`✓ share پیدا شد → ${fmtHash(value)}`, "ok");
            }
          },
          // error callback
          (error) => {
            const m = error?.message || error;
            addLog(`خطا: ${m}`, "err");
            setStatus("خطا در ماینر", "err");
          }
        );

        $("threads").textContent = threads;
        setStatus("ماینر فعال است ✅", "ok");
        addLog(`ماینر روی ${threads} ترد اجرا شد`, "ok");
        minerRunning = true;

      } catch (err) {
        const m = err?.message || err;
        addLog(`اجرای ماینر ناموفق: ${m}`, "err");
        setStatus("اجرای ماینر ناموفق", "err");
        btnStart.disabled = false;
        btnStop.disabled = true;
      }
    }

    // ─── توقف ───
    function stopMiner() {
      try {
        cpuWebMiner.stop();
        minerRunning = false;
        btnStart.disabled = false;
        btnStop.disabled = true;
        setStatus("ماینر متوقف شد", "err");
        addLog("⏹ ماینر متوقف شد", "warn");
      } catch (e) {
        addLog(`خطا در توقف: ${e?.message || e}`, "err");
      }
    }

    // ─── رویدادها ───
    btnStart.addEventListener("click", startMiner);
    btnStop.addEventListener("click", stopMiner);

    walletInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !btnStart.disabled) btnStart.click();
    });

    // ─── گزارش زنده هر ۵ ثانیه ───
    setInterval(() => {
      if (!minerRunning) return;

      const uptimeSec = Math.floor((Date.now() - startTime) / 1000);
      const m = Math.floor(uptimeSec / 60);
      const s = uptimeSec % 60;
      const uptime = `${m}m ${pad(s)}s`;

      const hrText = currentHashrate > 0
        ? fmtHash(currentHashrate)
        : "در انتظار share";

      addLog(
        `[Stats] HR:${hrText} | A:${acceptedCount} | R:${rejectedCount} | Job:${lastJobId} | Up:${uptime}`,
        "warn"
      );
    }, 5000);

    // ─── پیام خوش‌آمد ───
    addLog("صفحه آماده است", "info");
    addLog("آدرس کیف پول RVN را وارد و شروع کن", "info");
    setStatus("آماده برای شروع");
  </script>
</body>
</html>
