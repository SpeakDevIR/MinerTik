<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RVN Web Miner</title>

  <!-- ═══════ FAVICON ═══════ -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⛏️</text></svg>">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0a0e1a;
      --border: #1e293b;
      --neon: #00ff9d;
      --neon2: #7c3aed;
      --rvn: #4a90e2;
      --text: #e2e8f0;
      --muted: #64748b;
      --red: #ef4444;
      --yellow: #facc15;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at 20% 0%, #1e1b4b 0%, var(--bg) 45%, #000 100%);
      color: var(--text);
      font-family: "Segoe UI", Tahoma, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 20px;
    }

    .container { width: 100%; max-width: 800px; }

    header { text-align: center; margin-bottom: 30px; }

    .logo {
      width: 72px; height: 72px;
      margin: 0 auto 12px;
      background: linear-gradient(135deg, var(--rvn), var(--neon2));
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 38px;
      box-shadow: 0 0 40px rgba(74,144,226,.6), 0 0 80px rgba(124,58,237,.3);
      animation: pulse-glow 2s ease-in-out infinite;
    }
    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 30px rgba(74,144,226,.6), 0 0 60px rgba(124,58,237,.3); }
      50%      { box-shadow: 0 0 50px rgba(74,144,226,.9), 0 0 100px rgba(124,58,237,.5); }
    }

    h1 {
      font-size: 26px; font-weight: 800;
      background: linear-gradient(90deg, #00ff9d, #4a90e2, #7c3aed, #00ff9d);
      background-size: 300% 100%;
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: gradient-shift 4s linear infinite;
    }
    @keyframes gradient-shift { to { background-position: 300% 0; } }

    .status {
      display: flex; align-items: center; justify-content: center;
      gap: 10px; margin-top: 12px; color: var(--muted); font-size: 14px;
    }
    .dot {
      width: 12px; height: 12px; border-radius: 50%;
      background: var(--yellow); box-shadow: 0 0 12px var(--yellow);
      animation: blink 1.2s ease-in-out infinite;
    }
    .dot.ok  { background: var(--neon); box-shadow: 0 0 12px var(--neon); }
    .dot.err { background: var(--red);  box-shadow: 0 0 12px var(--red); }
    @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:.3;} }

    .control-box {
      background: linear-gradient(180deg, rgba(30,41,59,.8), rgba(15,23,42,.95));
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 22px;
      position: relative;
      overflow: hidden;
    }
    .control-box::before {
      content: ""; position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, transparent, var(--rvn), transparent);
    }

    .control-label {
      display: block; font-size: 12px; color: var(--muted);
      text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: 600;
    }
    .control-input {
      width: 100%;
      background: #0a0e1a;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      color: var(--text);
      font-family: "Courier New", monospace;
      font-size: 13px;
      direction: ltr; text-align: left;
      transition: border-color .2s, box-shadow .2s;
      outline: none;
    }
    .control-input:focus {
      border-color: var(--neon);
      box-shadow: 0 0 0 3px rgba(0, 255, 157, .1);
    }

    .control-actions { display: flex; gap: 12px; margin-top: 16px; }
    .btn {
      flex: 1;
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all .2s ease;
      font-family: inherit;
      color: #fff;
    }
    .btn-start {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      box-shadow: 0 4px 20px rgba(34,197,94,.4);
    }
    .btn-start:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 28px rgba(34,197,94,.6);
    }
    .btn-stop {
      background: linear-gradient(135deg, #ef4444, #b91c1c);
      box-shadow: 0 4px 20px rgba(239,68,68,.4);
    }
    .btn-stop:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 28px rgba(239,68,68,.6);
    }
    .btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }

    .console-wrap {
      background: rgba(5, 8, 15, 0.9);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.05);
    }
    .console-header {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 16px;
      background: linear-gradient(180deg, #1e293b, #0f172a);
      border-bottom: 1px solid var(--border);
    }
    .traffic { display: flex; gap: 7px; }
    .traffic span { width: 12px; height: 12px; border-radius: 50%; }
    .traffic span:nth-child(1) { background: #ff5f57; }
    .traffic span:nth-child(2) { background: #febc2e; }
    .traffic span:nth-child(3) { background: #28c840; }
    .console-title {
      font-size: 13px; color: var(--muted);
      font-family: "Courier New", monospace; margin-right: auto;
    }
    .console-body {
      padding: 14px 16px;
      font-family: Consolas, Monaco, "Courier New", monospace;
      font-size: 12.5px; line-height: 1.7;
      height: 300px; overflow-y: auto;
      direction: ltr; text-align: left;
      background: repeating-linear-gradient(0deg, rgba(0,255,157,.02) 0, rgba(0,255,157,.02) 1px, transparent 1px, transparent 3px);
    }
    .console-body::-webkit-scrollbar { width: 10px; }
    .console-body::-webkit-scrollbar-track { background: #0a0e1a; }
    .console-body::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 5px; border: 2px solid #0a0e1a; }

    .line {
      display: flex; gap: 8px; padding: 3px 0;
      border-bottom: 1px solid #1a1a1a; word-break: break-word;
      animation: fade-in .3s ease;
    }
    @keyframes fade-in {
      from { opacity: 0; transform: translateX(-6px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    .line .time { color: #475569; flex-shrink: 0; }
    .line .msg  { flex: 1; color: #cbd5e1; }
    .line.info .msg { color: #38bdf8; }
    .line.ok   .msg { color: #22c55e; }
    .line.warn .msg { color: var(--yellow); }
    .line.err  .msg { color: var(--red); }

    footer {
      margin-top: 24px; text-align: center;
      font-size: 12px; color: var(--muted);
    }
    footer strong { color: var(--rvn); }

    @media (max-width: 640px) {
      h1 { font-size: 20px; }
      .logo { width: 56px; height: 56px; font-size: 28px; }
      .control-actions { flex-direction: column; }
      .console-body { height: 240px; font-size: 11.5px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">⛏️</div>
      <h1>در حال ماینینگ RVN</h1>
      <div class="status">
        <span class="dot" id="dot"></span>
        <span id="statusText">آماده برای شروع</span>
      </div>
    </header>

    <section class="control-box">
      <label class="control-label" for="walletInput">آدرس کیف پول RVN</label>
      <input type="text" id="walletInput" class="control-input"
             placeholder="Rxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
             spellcheck="false" autocomplete="off"
             value="RHsjBqrF9wChkHWCwpFWmsD2busLyfUeB2">

      <div class="control-actions">
        <button id="btnStart" class="btn btn-start">▶ شروع ماینینگ</button>
        <button id="btnStop" class="btn btn-stop" disabled>⏹ توقف</button>
      </div>
    </section>

    <section class="console-wrap">
      <div class="console-header">
        <div class="traffic"><span></span><span></span><span></span></div>
        <div class="console-title">miner@rvn: ~/console</div>
      </div>
      <div class="console-body" id="consoleBody"></div>
    </section>

    <footer>
      ماینینگ <strong>Ravencoin</strong> · قدرت پردازش شما در اختیار استخر قرار می‌گیرد
    </footer>
  </div>

  <!-- کتابخانه‌ی ماینر -->
  <script type="module">
    import * as minotaurx from "https://esm.run/@marco_ciaramella/minotaurx-web";

    const $ = (id) => document.getElementById(id);
    const consoleBody = $("consoleBody");
    const dot = $("dot");
    const statusText = $("statusText");
    const btnStart = $("btnStart");
    const btnStop = $("btnStop");
    const walletInput = $("walletInput");

    const pad = (n) => String(n).padStart(2, "0");
    const MAX_LOGS = 250;
    let minerRunning = false;

    function escapeHtml(s) {
      return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function addLog(msg, type = "info") {
      const d = new Date();
      const t = `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
      const line = document.createElement("div");
      line.className = `line ${type}`;
      line.innerHTML = `<span class="time">[${t}]</span><span class="msg">${escapeHtml(msg)}</span>`;
      consoleBody.appendChild(line);
      while (consoleBody.children.length > MAX_LOGS) consoleBody.removeChild(consoleBody.firstChild);
      consoleBody.scrollTop = consoleBody.scrollHeight;
      const fn = type === "err" ? "error" : type === "warn" ? "warn" : "log";
      console[fn]("[miner]", msg);
    }

    function setStatus(text, kind = "warn") {
      statusText.textContent = text;
      dot.className = "dot" + (kind === "ok" ? " ok" : kind === "err" ? " err" : "");
    }

    function isValidWallet(w) {
      return /^R[1-9A-HJ-NP-Za-km-z]{25,40}$/.test(w.trim());
    }

    // ─── شروع ماینینگ ───
    btnStart.addEventListener("click", () => {
      const wallet = walletInput.value.trim();

      if (!isValidWallet(wallet)) {
        addLog("آدرس کیف پول معتبر نیست (باید با R شروع شود)", "err");
        setStatus("ولت نامعتبر", "err");
        return;
      }

      if (minerRunning) {
        addLog("ماینر در حال اجراست", "warn");
        return;
      }

      addLog(`شروع ماینینگ با ولت: ${wallet}`, "info");
      setStatus("در حال اتصال…");

      try {
        minotaurx.mine({
          stratum: {
            server: "minotaurx.na.mine.zpool.ca",
            port: 7019,
            worker: wallet,
            password: "c=RVN",
          },
          options: {
            log: true,
          },
        });

        minerRunning = true;
        btnStart.disabled = true;
        btnStop.disabled = false;
        setStatus("ماینر فعال است ✅", "ok");
        addLog("ماینر با موفقیت شروع شد", "ok");
        addLog("در حال دریافت کار از استخر…", "info");
      } catch (err) {
        addLog(`خطا در شروع: ${err.message || err}`, "err");
        setStatus("خطا در ماینر", "err");
      }
    });

    // ─── توقف ماینینگ ───
    btnStop.addEventListener("click", () => {
      try {
        minotaurx.stop();
        minerRunning = false;
        btnStart.disabled = false;
        btnStop.disabled = true;
        setStatus("ماینر متوقف شد", "err");
        addLog("⏹ ماینر متوقف شد", "warn");
      } catch (e) {
        addLog(`خطا در توقف: ${e.message || e}`, "err");
      }
    });

    // ─── پیام خوش‌آمد ───
    addLog("صفحه آماده است. آدرس کیف پول RVN را وارد کنید.", "info");
    setStatus("آماده برای شروع");
  </script>
</body>
</html>
