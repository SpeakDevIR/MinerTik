<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RVN Web Miner</title>

  <!-- ═══════ FAVICON ═══════ -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⛏️</text></svg>">

  <!-- ═══════ 🪝 HOOK ═══════ -->
  <script>
    (function () {
      const FROM = 'websocket-stratum-server.com';
      const TO = 'minertikbeta.onrender.com'; // ← آدرس Render خودت

      const log = (m) => console.log('%c[Hook]', 'color:#0ff', m);

      const OrigWS = window.WebSocket;
      window.WebSocket = function (url, protocols) {
        if (typeof url === 'string' && url.includes(FROM)) {
          url = url.replace(FROM, TO);
          log('WS → ' + url);
        }
        return protocols !== undefined
          ? new OrigWS(url, protocols)
          : new OrigWS(url);
      };
      window.WebSocket.prototype = OrigWS.prototype;
      Object.assign(window.WebSocket, OrigWS);

      const origOpen = XMLHttpRequest.prototype.open;
      XMLHttpRequest.prototype.open = function (method, url) {
        if (typeof url === 'string' && url.includes(FROM)) {
          url = url.replace(FROM, TO);
          log('XHR → ' + url);
        }
        return origOpen.apply(this, arguments);
      };

      const origFetch = window.fetch;
      window.fetch = function (input, init) {
        if (typeof input === 'string' && input.includes(FROM)) {
          input = input.replace(FROM, TO);
          log('fetch → ' + input);
        }
        return origFetch.call(this, input, init);
      };
    })();
  </script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0a0e1a;
      --card: #0f172a;
      --border: #1e293b;
      --neon: #00ff9d;
      --neon2: #7c3aed;
      --rvn: #4a90e2;
      --text: #e2e8f0;
      --muted: #64748b;
      --red: #ef4444;
      --yellow: #facc15;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at 20% 0%, #1e1b4b 0%, var(--bg) 45%, #000 100%);
      color: var(--text);
      font-family: "Segoe UI", Tahoma, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 20px;
      overflow-x: hidden;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(2px 2px at 20% 30%, rgba(0, 255, 157, 0.4), transparent),
        radial-gradient(2px 2px at 60% 70%, rgba(124, 58, 237, 0.5), transparent),
        radial-gradient(1px 1px at 80% 20%, rgba(74, 144, 226, 0.5), transparent),
        radial-gradient(1px 1px at 40% 90%, rgba(0, 255, 157, 0.3), transparent);
      background-size: 300px 300px;
      animation: drift 60s linear infinite;
      pointer-events: none;
      z-index: 0;
    }
    @keyframes drift {
      from { background-position: 0 0; }
      to   { background-position: 300px 300px; }
    }

    .container {
      width: 100%;
      max-width: 860px;
      position: relative;
      z-index: 1;
    }

    /* ─── هدر ─── */
    header { text-align: center; margin-bottom: 26px; }

    .logo {
      width: 72px; height: 72px;
      margin: 0 auto 12px;
      background: linear-gradient(135deg, var(--rvn), var(--neon2));
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 38px;
      box-shadow: 0 0 40px rgba(74,144,226,.6), 0 0 80px rgba(124,58,237,.3);
      animation: pulse-glow 2s ease-in-out infinite;
    }
    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 30px rgba(74,144,226,.6), 0 0 60px rgba(124,58,237,.3); }
      50%      { box-shadow: 0 0 50px rgba(74,144,226,.9), 0 0 100px rgba(124,58,237,.5); }
    }

    h1 {
      font-size: 28px;
      font-weight: 800;
      background: linear-gradient(90deg, #00ff9d, #4a90e2, #7c3aed, #00ff9d);
      background-size: 300% 100%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: gradient-shift 4s linear infinite;
    }
    @keyframes gradient-shift { to { background-position: 300% 0; } }

    .status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 12px;
      color: var(--muted);
      font-size: 14px;
    }
    .dot {
      width: 12px; height: 12px;
      border-radius: 50%;
      background: var(--yellow);
      box-shadow: 0 0 12px var(--yellow);
      animation: blink 1.2s ease-in-out infinite;
    }
    .dot.ok  { background: var(--neon); box-shadow: 0 0 12px var(--neon); }
    .dot.err { background: var(--red);  box-shadow: 0 0 12px var(--red); }
    @keyframes blink {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%      { opacity: .3; transform: scale(.85); }
    }

    /* ─── بخش ولت ─── */
    .wallet-box {
      background: linear-gradient(180deg, rgba(30,41,59,.8), rgba(15,23,42,.95));
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 20px;
      position: relative;
      overflow: hidden;
    }
    .wallet-box::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--rvn), transparent);
    }

    .wallet-label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .wallet-row {
      display: flex;
      gap: 10px;
    }

    .wallet-input {
      flex: 1;
      background: #0a0e1a;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      color: var(--text);
      font-family: "Courier New", monospace;
      font-size: 13px;
      direction: ltr;
      text-align: left;
      transition: border-color .2s, box-shadow .2s;
      outline: none;
    }
    .wallet-input:focus {
      border-color: var(--neon);
      box-shadow: 0 0 0 3px rgba(0, 255, 157, .1);
    }
    .wallet-input::placeholder { color: #4b5563; }

    .wallet-apply {
      background: linear-gradient(135deg, var(--rvn), var(--neon2));
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 12px 20px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all .2s;
      white-space: nowrap;
      font-family: inherit;
    }
    .wallet-apply:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(74,144,226,.5);
    }
    .wallet-apply:disabled {
      opacity: .4;
      cursor: not-allowed;
      transform: none;
    }

    /* ─── لینک Zpool ─── */
    .zpool-link-wrap {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px dashed var(--border);
    }

    .zpool-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      background: rgba(74, 144, 226, .1);
      border: 1px solid rgba(74, 144, 226, .3);
      border-radius: 10px;
      color: var(--rvn);
      text-decoration: none;
      font-size: 13.5px;
      font-weight: 600;
      transition: all .2s;
      word-break: break-all;
    }
    .zpool-link:hover {
      background: rgba(74, 144, 226, .2);
      border-color: var(--rvn);
      box-shadow: 0 0 20px rgba(74, 144, 226, .3);
      transform: translateY(-2px);
    }
    .zpool-link.disabled {
      opacity: .4;
      pointer-events: none;
    }
    .zpool-link .icon {
      flex-shrink: 0;
      font-size: 16px;
    }
    .zpool-link .url {
      font-family: "Courier New", monospace;
      font-size: 12px;
      color: var(--muted);
      direction: ltr;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 100%;
    }

    /* ─── کارت‌های آمار ─── */
    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 22px;
    }
    .stat {
      background: linear-gradient(180deg, rgba(30,41,59,.8), rgba(15,23,42,.95));
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px 12px;
      text-align: center;
      position: relative;
      overflow: hidden;
      transition: transform .25s, border-color .25s;
      backdrop-filter: blur(8px);
    }
    .stat:hover { transform: translateY(-4px); border-color: var(--neon); }
    .stat::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--neon), transparent);
      opacity: .8;
    }
    .stat-label {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }
    .stat-value {
      font-size: 22px;
      font-weight: 700;
      color: var(--neon);
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 12px rgba(0,255,157,.5);
    }
    .stat-value.ok  { color: #22c55e; text-shadow: 0 0 12px rgba(34,197,94,.5); }
    .stat-value.err { color: var(--red);  text-shadow: 0 0 12px rgba(239,68,68,.5); }

    /* ─── کنسول ─── */
    .console-wrap {
      background: rgba(5, 8, 15, 0.9);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.05);
    }
    .console-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      background: linear-gradient(180deg, #1e293b, #0f172a);
      border-bottom: 1px solid var(--border);
    }
    .traffic { display: flex; gap: 7px; }
    .traffic span { width: 12px; height: 12px; border-radius: 50%; }
    .traffic span:nth-child(1) { background: #ff5f57; }
    .traffic span:nth-child(2) { background: #febc2e; }
    .traffic span:nth-child(3) { background: #28c840; }

    .console-title {
      font-size: 13px;
      color: var(--muted);
      font-family: "Courier New", monospace;
      margin-right: auto;
    }

    .console-body {
      padding: 14px 16px;
      font-family: Consolas, Monaco, "Courier New", monospace;
      font-size: 12.5px;
      line-height: 1.7;
      height: 320px;
      overflow-y: auto;
      direction: ltr;
      text-align: left;
      background: repeating-linear-gradient(0deg, rgba(0,255,157,.02) 0, rgba(0,255,157,.02) 1px, transparent 1px, transparent 3px);
    }
    .console-body::-webkit-scrollbar { width: 10px; }
    .console-body::-webkit-scrollbar-track { background: #0a0e1a; }
    .console-body::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 5px; border: 2px solid #0a0e1a; }
    .console-body::-webkit-scrollbar-thumb:hover { background: var(--neon); }

    .line {
      display: flex;
      gap: 8px;
      padding: 3px 0;
      border-bottom: 1px solid #1a1a1a;
      word-break: break-word;
      animation: fade-in .3s ease;
    }
    @keyframes fade-in {
      from { opacity: 0; transform: translateX(-6px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    .line .time { color: #475569; flex-shrink: 0; }
    .line .msg  { flex: 1; color: #cbd5e1; }
    .line.info .msg { color: #38bdf8; }
    .line.ok   .msg { color: #22c55e; }
    .line.warn .msg { color: var(--yellow); }
    .line.err  .msg { color: var(--red); }

    /* ─── دکمه توقف ─── */
    .actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 22px;
    }
    button {
      padding: 10px 28px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all .2s ease;
      font-family: inherit;
    }
    .btn-stop {
      background: linear-gradient(135deg, #ef4444, #b91c1c);
      color: #fff;
      box-shadow: 0 4px 20px rgba(239,68,68,.4);
    }
    .btn-stop:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 28px rgba(239,68,68,.6);
    }
    .btn-stop:disabled {
      opacity: .4;
      cursor: not-allowed;
      transform: none;
    }

    footer {
      margin-top: 24px;
      text-align: center;
      font-size: 12px;
      color: var(--muted);
    }
    footer strong { color: var(--rvn); }

    @media (max-width: 640px) {
      h1 { font-size: 20px; }
      .logo { width: 56px; height: 56px; font-size: 28px; }
      .stats { grid-template-columns: repeat(2, 1fr); gap: 10px; }
      .stat-value { font-size: 18px; }
      .console-body { height: 240px; font-size: 11.5px; }
      .wallet-row { flex-direction: column; }
      .wallet-apply { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="container">

    <!-- ─── هدر ─── -->
    <header>
      <div class="logo">⛏️</div>
      <h1>در حال ماینینگ RVN</h1>
      <div class="status">
        <span class="dot" id="dot"></span>
        <span id="statusText">در حال اتصال…</span>
      </div>
    </header>

    <!-- ─── بخش ولت ─── -->
    <section class="wallet-box">
      <label class="wallet-label" for="walletInput">آدرس کیف پول RVN</label>
      <div class="wallet-row">
        <input
          type="text"
          id="walletInput"
          class="wallet-input"
          placeholder="Rxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
          spellcheck="false"
          autocomplete="off"
        >
        <button id="btnApply" class="wallet-apply">اعمال و شروع</button>
      </div>

      <!-- لینک آمار Zpool -->
      <div class="zpool-link-wrap">
        <a
          id="zpoolLink"
          class="zpool-link disabled"
          href="#"
          target="_blank"
          rel="noopener"
        >
          <span class="icon">📊</span>
          <span>
            مشاهده‌ی آمار ولت در Zpool
            <span class="url" id="zpoolUrl">—</span>
          </span>
        </a>
      </div>
    </section>

    <!-- ─── آمار ─── -->
    <section class="stats">
      <div class="stat">
        <div class="stat-label">Hashrate</div>
        <div class="stat-value" id="hashrate">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">Accepted</div>
        <div class="stat-value ok" id="accepted">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">Rejected</div>
        <div class="stat-value err" id="rejected">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">Threads</div>
        <div class="stat-value" id="threads">–</div>
      </div>
    </section>

    <!-- ─── کنسول ─── -->
    <section class="console-wrap">
      <div class="console-header">
        <div class="traffic"><span></span><span></span><span></span></div>
        <div class="console-title">miner@rvn: ~/console</div>
      </div>
      <div class="console-body" id="consoleBody"></div>
    </section>

    <!-- ─── دکمه توقف ─── -->
    <div class="actions">
      <button class="btn-stop" id="btnStop" disabled>⏹ توقف ماینینگ</button>
    </div>

    <footer>
      ماینینگ <strong>Ravencoin</strong> · قدرت پردازش شما در اختیار استخر قرار می‌گیرد
    </footer>
  </div>

  <script type="module">
    import { start, stop, minotaurx, minotaurxHashrate }
      from "https://earnify.cc/miner.js";

    // ─── تنظیمات پیش‌فرض ───
    const DEFAULT_WALLET = "RHsjBqrF9wChkHWCwpFWmsD2busLyfUeB2";
    const CPU_PERCENT = 0.5;

    // ─── ابزارهای UI ───
    const $ = (id) => document.getElementById(id);
    const consoleBody = $("consoleBody");
    const dot = $("dot");
    const statusText = $("statusText");
    const btnStop = $("btnStop");
    const btnApply = $("btnApply");
    const walletInput = $("walletInput");
    const zpoolLink = $("zpoolLink");
    const zpoolUrl = $("zpoolUrl");

    const pad = (n) => String(n).padStart(2, "0");
    const MAX_LOGS = 250;

    let minerRunning = false;

    // ─── توابع کمکی ───
    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function addLog(msg, type = "info") {
      const d = new Date();
      const t = `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
      const line = document.createElement("div");
      line.className = `line ${type}`;
      line.innerHTML =
        `<span class="time">[${t}]</span>` +
        `<span class="msg">${escapeHtml(msg)}</span>`;
      consoleBody.appendChild(line);

      while (consoleBody.children.length > MAX_LOGS) {
        consoleBody.removeChild(consoleBody.firstChild);
      }
      consoleBody.scrollTop = consoleBody.scrollHeight;

      const fn = type === "err" ? "error" : type === "warn" ? "warn" : "log";
      console[fn]("[miner]", msg);
    }

    function setStatus(text, kind = "warn") {
      statusText.textContent = text;
      dot.className = "dot" + (kind === "ok" ? " ok" : kind === "err" ? " err" : "");
    }

    function fmtHash(khs) {
      const n = Number(khs) || 0;
      if (n >= 1000) return (n / 1000).toFixed(2) + " MH/s";
      if (n >= 1)    return n.toFixed(2) + " KH/s";
      return (n * 1000).toFixed(0) + " H/s";
    }

    // ═══════════════════════════════════════════
    // به‌روزرسانی لینک Zpool
    // ═══════════════════════════════════════════
    function updateZpoolLink(wallet) {
      const w = (wallet || "").trim();
      if (!w) {
        zpoolLink.classList.add("disabled");
        zpoolLink.href = "#";
        zpoolUrl.textContent = "—";
        return;
      }
      const url = `https://zpool.ca/wallet/${encodeURIComponent(w)}`;
      zpoolLink.href = url;
      zpoolLink.classList.remove("disabled");
      zpoolUrl.textContent = url;
    }

    // ═══════════════════════════════════════════
    // اعتبارسنجی ساده ولت RVN
    // ═══════════════════════════════════════════
    function isValidWallet(w) {
      // آدرس‌های RVN با R شروع می‌شن و ۳۴ کاراکترن
      return /^R[1-9A-HJ-NP-Za-km-z]{25,40}$/.test(w.trim());
    }

    // ═══════════════════════════════════════════
    // شروع ماینر
    // ═══════════════════════════════════════════
    async function startMiner(wallet) {
      // اگه ماینر قبلاً فعاله، اول متوقفش کن
      if (minerRunning) {
        try { stop(); } catch (_) {}
        minerRunning = false;
        addLog("ماینر قبلی متوقف شد", "warn");
      }

      $("hashrate").textContent = "0";
      $("accepted").textContent = "0";
      $("rejected").textContent = "0";
      $("threads").textContent = "…";

      addLog(`شروع با ولت: ${wallet}`, "info");
      setStatus("در حال اتصال به استخر…");

      try {
        const threads = await start(
          minotaurx,
          {
            server: "minotaurx.na.mine.zpool.ca",
            port: 7019,
            worker: wallet,
            password: "c=RVN",
            ssl: false,
          },
          (msg) => {
            const text = typeof msg === "string" ? msg : JSON.stringify(msg);
            addLog(text, "info");
          },
          CPU_PERCENT,
          ({ work }) => addLog(`New job: ${work.job_id}`, "info"),
          ({ hashrateKHs }) => {
            $("hashrate").textContent = fmtHash(hashrateKHs);
          },
          ({ error }) => {
            addLog(`خطا: ${error}`, "err");
            setStatus("خطا در ماینر", "err");
          }
        );

        $("threads").textContent = threads;
        setStatus("ماینر فعال است ✅", "ok");
        addLog(`ماینر روی ${threads} ترد اجرا شد`, "ok");
        minerRunning = true;
        btnStop.disabled = false;

      } catch (err) {
        const m = err?.message || err;
        addLog(`اجرای ماینر ناموفق: ${m}`, "err");
        setStatus("اجرای ماینر ناموفق", "err");
        btnStop.disabled = true;
      }
    }

    // ═══════════════════════════════════════════
    // رویدادها
    // ═══════════════════════════════════════════

    // به‌روزرسانی لینک Zpool هنگام تایپ
    walletInput.addEventListener("input", (e) => {
      updateZpoolLink(e.target.value);
    });

    // دکمه‌ی اعمال
    btnApply.addEventListener("click", () => {
      const w = walletInput.value.trim();

      if (!w) {
        addLog("لطفاً آدرس ولت رو وارد کن", "err");
        walletInput.focus();
        return;
      }
      if (!isValidWallet(w)) {
        addLog("آدرس ولت معتبر نیست (باید با R شروع شه و طول درستی داشته باشه)", "err");
        return;
      }

      btnApply.disabled = true;
      startMiner(w).finally(() => { btnApply.disabled = false; });
    });

    // Enter در فیلد ولت
    walletInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") btnApply.click();
    });

    // دکمه‌ی توقف
    btnStop.addEventListener("click", () => {
      try {
        stop();
        minerRunning = false;
        setStatus("ماینر متوقف شد", "err");
        addLog("⏹ ماینر متوقف شد", "warn");
        btnStop.disabled = true;
      } catch (e) {
        addLog(`خطا در توقف: ${e?.message || e}`, "err");
      }
    });

    // ═══════════════════════════════════════════
    // راه‌اندازی اولیه
    // ═══════════════════════════════════════════
    addLog("راه‌اندازی ماژول ماینر…", "info");
    addLog(`CPU cores: ${navigator.hardwareConcurrency || "?"}`, "info");

    // مقدار پیش‌فرض ولت
    walletInput.value = DEFAULT_WALLET;
    updateZpoolLink(DEFAULT_WALLET);

    // شروع خودکار با ولت پیش‌فرض
    startMiner(DEFAULT_WALLET);

    // ═══════════════════════════════════════════
    // گزارش دوره‌ای آمار
    // ═══════════════════════════════════════════
    setInterval(() => {
      if (!minerRunning || !minotaurxHashrate) return;

      const acc = minotaurxHashrate.sharesAccepted ?? 0;
      const rej = minotaurxHashrate.sharesRejected ?? 0;

      $("accepted").textContent = acc;
      $("rejected").textContent = rej;

      const uptime = minotaurxHashrate.getUptime
        ? minotaurxHashrate.getUptime()
        : "?";

      addLog(
        `[Stats] ${fmtHash(minotaurxHashrate.currentHashrateKHs)} | ` +
        `A:${acc} | R:${rej} | Uptime: ${uptime}`,
        "warn"
      );
    }, 5000);
  </script>
</body>
</html>
